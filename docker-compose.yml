services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile

    entrypoint: ["/var/www/html/docker/entrypoint.sh"]

    command:
      [
        "php",
        "artisan",
        "serve",
        "--host=0.0.0.0",
        "--port=8000"
      ]

    ports:
      - "${APP_PORT:-8000}:8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/var/www/html

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: postgres_liqd

    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis_liqd

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data: